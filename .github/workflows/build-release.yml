name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'

  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare Release Package
      shell: pwsh
      run: |
        mkdir release
        mkdir release/include
        mkdir release/bin

        Copy-Item -Recurse "include/BMP" "release/include/"
        Copy-Item "build/Release/BMP.dll" "release/bin/"
        Copy-Item "build/Release/BMP.lib" "release/bin/"

        Compress-Archive `
          -Path "release/*" `
          -DestinationPath "BMP_Library_${{ github.ref_name }}.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BMP-Library-Package
        path: release/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: BMP_Library_${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
